<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="238" viewBox="0 0 1200 238" role="img" aria-labelledby="title desc">
<title id="title">SHM — sensor to dashboard</title>
<desc id="desc">Teng / James Vincent Calunsag. Forest green, muted gold, and textured drafting paper. Static artwork.</desc>
<defs>
  <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#B5BAA7" stroke-opacity=".24" stroke-width=".6"/></pattern>
  <filter id="grain" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency=".76" numOctaves="3" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter>
  <filter id="shadow" x="-40%" y="-40%" width="200%" height="210%"><feDropShadow dx="3" dy="12" stdDeviation="9" flood-color="#233E31" flood-opacity=".22"/></filter>
  <linearGradient id="green-top" x2=".3" y2="1"><stop stop-color="#638067"/><stop offset="1" stop-color="#3E6049"/></linearGradient>
  <linearGradient id="cream-top" x2=".3" y2="1"><stop stop-color="#FAF8EF"/><stop offset="1" stop-color="#D8D9C9"/></linearGradient>
  <linearGradient id="gold-top" x2=".3" y2="1"><stop stop-color="#D8C486"/><stop offset="1" stop-color="#AD9554"/></linearGradient>
</defs>
<style>text { font-family: 'Segoe UI', Arial, sans-serif; } .mono { font-family: Consolas, 'Courier New', monospace; }</style>
<rect x="0" y="0" width="1200" height="238" rx="0" fill="#F0EFE7" />
<rect x="0" y="0" width="1200" height="238" rx="0" fill="url(#grid)" /><text x="32" y="38" font-size="12" fill="#626D5D" font-weight="400" class="mono" letter-spacing="2">SHM / FROM SENSOR TO SCREEN</text><rect x="32" y="73" width="204" height="120" rx="0" fill="#F0EFE7" stroke="#89947A"/><rect x="32" y="73" width="204" height="4" rx="0" fill="#B39B59" /><text x="47" y="102" font-size="11" fill="#626D5D" font-weight="400" class="mono">01</text><text x="47" y="137" font-size="17" fill="#233E31" font-weight="600" class="mono">SENSOR</text><text x="47" y="165" font-size="14" fill="#626D5D" font-weight="400" >accel / strain</text><path d="M236 134h26m-6 -5l6 5l-6 5" fill="none" stroke="#42634B" stroke-width="1.2" /><rect x="265" y="73" width="204" height="120" rx="0" fill="#F0EFE7" stroke="#89947A"/><rect x="265" y="73" width="204" height="4" rx="0" fill="#42634B" /><text x="280" y="102" font-size="11" fill="#626D5D" font-weight="400" class="mono">02</text><text x="280" y="137" font-size="17" fill="#233E31" font-weight="600" class="mono">ESP32</text><text x="280" y="165" font-size="14" fill="#626D5D" font-weight="400" >filter / pack</text><path d="M469 134h26m-6 -5l6 5l-6 5" fill="none" stroke="#42634B" stroke-width="1.2" /><rect x="498" y="73" width="204" height="120" rx="0" fill="#F0EFE7" stroke="#89947A"/><rect x="498" y="73" width="204" height="4" rx="0" fill="#42634B" /><text x="513" y="102" font-size="11" fill="#626D5D" font-weight="400" class="mono">03</text><text x="513" y="137" font-size="17" fill="#233E31" font-weight="600" class="mono">TRANSPORT</text><text x="513" y="165" font-size="14" fill="#626D5D" font-weight="400" >Wi-Fi / MQTT</text><path d="M702 134h26m-6 -5l6 5l-6 5" fill="none" stroke="#42634B" stroke-width="1.2" /><rect x="731" y="73" width="204" height="120" rx="0" fill="#F0EFE7" stroke="#89947A"/><rect x="731" y="73" width="204" height="4" rx="0" fill="#42634B" /><text x="746" y="102" font-size="11" fill="#626D5D" font-weight="400" class="mono">04</text><text x="746" y="137" font-size="17" fill="#233E31" font-weight="600" class="mono">STORAGE</text><text x="746" y="165" font-size="14" fill="#626D5D" font-weight="400" >time series</text><path d="M935 134h26m-6 -5l6 5l-6 5" fill="none" stroke="#42634B" stroke-width="1.2" /><rect x="964" y="73" width="204" height="120" rx="0" fill="#F0EFE7" stroke="#89947A"/><rect x="964" y="73" width="204" height="4" rx="0" fill="#42634B" /><text x="979" y="102" font-size="11" fill="#626D5D" font-weight="400" class="mono">05</text><text x="979" y="137" font-size="17" fill="#233E31" font-weight="600" class="mono">DASHBOARD</text><text x="979" y="165" font-size="14" fill="#626D5D" font-weight="400" >charts / alerts</text><text x="32" y="220" font-size="10" fill="#626D5D" font-weight="400" class="mono">ACQUIRE → PROCESS → TRANSMIT → STORE → UNDERSTAND</text>
<rect x="0" y="0" width="1200" height="238" rx="0" fill="#808080" filter="url(#grain)" opacity=".065" pointer-events="none"/>
</svg>
