<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" role="img" aria-labelledby="title desc">
<title id="title">TENG mechanical keycap concept — forest, paper, and brass</title>
<desc id="desc">Teng / James Vincent Calunsag. Forest green, muted gold, and textured drafting paper. Static artwork.</desc>
