<title id="title">TENG — James Vincent Calunsag / Computer engineer</title>
<desc id="desc">A custom TENG wordmark on architectural construction lines, with a dimensional four-key mechanical keycap mockup in forest green, ivory, and muted gold. James Vincent Calunsag. Embedded systems, frontend, and visual design. Open to opportunities. Dapitan, Philippines.</desc>
