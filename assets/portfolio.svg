<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
<title id="title">Portfolio.docx — open my interactive portfolio</title>
<desc id="desc">Teng / James Vincent Calunsag. Forest green, muted gold, and textured drafting paper. Static artwork.</desc>
<defs>
  <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#B5BAA7" stroke-opacity=".24" stroke-width=".6"/></pattern>
  <filter id="grain" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency=".76" numOctaves="3" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter>
  <filter id="shadow" x="-40%" y="-40%" width="200%" height="210%"><feDropShadow dx="3" dy="12" stdDeviation="9" flood-color="#233E31" flood-opacity=".22"/></filter>
  <linearGradient id="green-top" x2=".3" y2="1"><stop stop-color="#638067"/><stop offset="1" stop-color="#3E6049"/></linearGradient>
  <linearGradient id="cream-top" x2=".3" y2="1"><stop stop-color="#FAF8EF"/><stop offset="1" stop-color="#D8D9C9"/></linearGradient>
  <linearGradient id="gold-top" x2=".3" y2="1"><stop stop-color="#D8C486"/><stop offset="1" stop-color="#AD9554"/></linearGradient>
</defs>
<style>text { font-family: 'Segoe UI', Arial, sans-serif; } .mono { font-family: Consolas, 'Courier New', monospace; }</style>
<rect x="0" y="0" width="1200" height="300" rx="0" fill="#F0EFE7" />
<rect x="724" y="0" width="476" height="300" rx="0" fill="url(#grid)" /><rect x="0" y="0" width="7" height="300" rx="0" fill="#42634B" /><text x="44" y="43" font-size="11" fill="#626D5D" font-weight="400" class="mono" letter-spacing="2">SELECTED WORK / 01</text><text x="41" y="117" font-size="57" fill="#233E31" font-weight="600" letter-spacing="-2">Portfolio.docx</text><text x="44" y="159" font-size="20" fill="#626D5D" font-weight="400" >A portfolio that behaves like a Word document.</text><rect x="44" y="204" width="243" height="43" rx="2" fill="#42634B" /><text x="60" y="231" font-size="12" fill="#F0EFE7" font-weight="600" class="mono" letter-spacing="1">OPEN THE DOCUMENT</text><path d="M258 232l11 -11m-11 0h11v11" fill="none" stroke="#F0EFE7" stroke-width="1.4" /><g transform="translate(853 26) rotate(7 100 120)" filter="url(#shadow)"><rect x="7" y="8" width="212" height="246" rx="2" fill="#D8DDCE" stroke="#89947A"/><rect x="0" y="0" width="212" height="246" rx="2" fill="#FAF9F1" stroke="#89947A"/><rect x="0" y="0" width="212" height="30" rx="0" fill="#42634B" /><text x="13" y="20" font-size="11" fill="#F0EFE7" font-weight="400" class="mono">portfolio.docx</text><g transform="translate(18 49) scale(0.17)"><path d="M0 0H100V26H64V124H36V26H0Z" fill="#B39B59" transform="translate(0 0)"/><path d="M100 0H0V124H100V98H28V75H87V49H28V26H100Z" fill="#42634B" transform="translate(116 0)"/><path d="M0 124V0H28L72 75V0H100V124H73L28 49V124Z" fill="#42634B" transform="translate(232 0)"/><path d="M100 0H32Q0 0 0 32V92Q0 124 32 124H100V55H53V80H73V98H36Q28 98 28 89V35Q28 26 36 26H100Z" fill="#42634B" transform="translate(348 0)"/></g><text x="18" y="107" font-size="20" fill="#233E31" font-weight="600" >Hello, I’m James.</text><text x="18" y="128" font-size="10" fill="#626D5D" font-weight="400" >Engineer. Builder. Designer.</text><path d="M18 151h168" fill="none" stroke="#B5BAA7" stroke-width="2" /><path d="M18 162h168" fill="none" stroke="#B5BAA7" stroke-width="2" /><path d="M18 173h121" fill="none" stroke="#B5BAA7" stroke-width="2" /><rect x="18" y="199" width="58" height="25" rx="2" fill="#B39B59" /><text x="27" y="216" font-size="10" fill="#233E31" font-weight="400" class="mono">WORK ↗</text><text x="185" y="229" font-size="9" fill="#626D5D" font-weight="400" class="mono">01</text></g>
<rect x="0" y="0" width="1200" height="300" rx="0" fill="#808080" filter="url(#grain)" opacity=".065" pointer-events="none"/>
