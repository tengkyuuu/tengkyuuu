<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280" role="img" aria-labelledby="title desc">
<title id="title">Portfolio.docx — open my interactive portfolio</title>
<desc id="desc">Custom navy and white artwork for James Vincent Calunsag. Decorative motion stops when reduced motion is requested.</desc>
<defs>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M 32 0 L 0 0 0 32" fill="none" stroke="#1B3A63" stroke-opacity=".3"/></pattern>
  <radialGradient id="halo"><stop stop-color="#2E5A94" stop-opacity=".4"/><stop offset="1" stop-color="#0A1628" stop-opacity="0"/></radialGradient>
  <linearGradient id="metal" x2="1" y2="1"><stop stop-color="#2E5A94"/><stop offset=".5" stop-color="#0F2039"/><stop offset="1" stop-color="#1B3A63"/></linearGradient>
</defs>
<style>
text { font-family: 'Segoe UI', Arial, sans-serif; }
.mono { font-family: Consolas, 'Courier New', monospace; }
.orbit { transform-box: fill-box; transform-origin: center; animation: orbit 38s linear infinite; }
.reverse { animation-direction: reverse; animation-duration: 52s; }
.flow { stroke-dasharray: 5 19; animation: flow 5s linear infinite; }
.pulse { animation: pulse 5s ease-in-out infinite; }
.float { animation: float 7s ease-in-out infinite; }
@keyframes orbit { to { transform: rotate(360deg); } }
@keyframes flow { to { stroke-dashoffset: -96; } }
@keyframes pulse { 0%, 100% { opacity: .35; } 50% { opacity: .9; } }
@keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
@media (prefers-reduced-motion: reduce) {
  .orbit, .flow, .pulse, .float { animation: none !important; }
}
</style>
<rect x="0" y="0" width="1200" height="280" rx="16" fill="#0A1628" />
<rect x="650" y="0" width="550" height="280" rx="0" fill="url(#grid)" /><text x="44" y="47" font-size="12" fill="#8A94A6" font-weight="400" class="mono" letter-spacing="2">FEATURED EXPERIENCE / 01</text><text x="41" y="119" font-size="54" fill="#FFFFFF" font-weight="600" letter-spacing="-2">Portfolio.docx</text><text x="44" y="162" font-size="21" fill="#C9CFD9" font-weight="400" >A portfolio that behaves like a Word document.</text><text x="44" y="226" font-size="13" fill="#FFFFFF" font-weight="600" class="mono" letter-spacing="1.5">OPEN THE DOCUMENT</text><path d="M247 221 H281 M274 214 L281 221 L274 228" fill="none" stroke="#C9CFD9" stroke-width="1.5" /><g class="float"><rect x="859" y="35" width="196" height="224" rx="8" fill="#0F2039" stroke="#1B3A63"/><rect x="840" y="20" width="196" height="224" rx="8" fill="#0A1628" stroke="#2E5A94"/><rect x="840" y="20" width="196" height="36" rx="8" fill="#1B3A63" /><text x="855" y="43" font-size="12" fill="#C9CFD9" font-weight="400" class="mono">portfolio.docx</text><text x="860" y="96" font-size="18" fill="#FFFFFF" font-weight="600" >Hello, I’m James.</text><text x="860" y="119" font-size="10" fill="#8A94A6" font-weight="400" >Engineer. Builder. Designer.</text><rect x="860" y="145" width="145" height="3" rx="1" fill="#1B3A63" /><rect x="860" y="157" width="145" height="3" rx="1" fill="#1B3A63" /><rect x="860" y="169" width="110" height="3" rx="1" fill="#1B3A63" /><rect x="860" y="197" width="57" height="21" rx="3" fill="#1B3A63" /><text x="870" y="212" font-size="10" fill="#C9CFD9" font-weight="400" class="mono">WORK ↗</text></g>
</svg>
